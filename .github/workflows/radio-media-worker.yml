name: Deploy Radio Media Worker

on:
  push:
    branches: ['main']
    paths:
      - 'workers/radio-media/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/radio-media-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radio-media-worker-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.3.0 --activate

      - name: Setup pnpm cache
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify Worker
        run: pnpm run radio:typecheck && pnpm run radio:test

      - name: Deploy Worker
        run: pnpm run radio:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
