<!doctype html>
<html lang="en">
  <head>
    <title>Code Rain renderer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        background: black;
        overflow: hidden;
        margin: 0;
        font-family: monospace;
        font-size: 2em;
        text-align: center;
      }

      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }

      p {
        color: hsl(108, 90%, 70%);
        text-shadow: hsl(108, 90%, 40%) 1px 0 10px;
      }

      .notice {
        margin-top: 10em;
        animation: fadeInAnimation ease 3s;
        animation-iteration-count: 1;
        animation-fill-mode: forwards;
      }

      @keyframes fadeInAnimation {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .pill {
        display: inline-block;
        background: gray;
        border: 0.3em solid lightgray;
        font-size: 1rem;
        font-family: monospace;
        color: white;
        padding: 0.5em 1em;
        border-radius: 2em;
        min-width: 6rem;
        margin: 3em;
        text-decoration: none;
        cursor: pointer;
        text-transform: uppercase;
        font-weight: bold;
      }

      .blue {
        background: linear-gradient(skyblue, blue, black, black, darkblue);
        border-color: darkblue;
        color: lightblue;
      }

      .blue:hover {
        border-color: blue;
        color: white;
      }

      .red {
        background: linear-gradient(lightpink, crimson, black, black, darkred);
        border-color: darkred;
        color: lightpink;
      }

      .red:hover {
        border-color: crimson;
      }
    </style>
    <script>
      (() => {
        const allowed = new Set([
          "animationSpeed",
          "bloomSize",
          "bloomStrength",
          "cycleSpeed",
          "density",
          "ditherMagnitude",
          "effect",
          "fallSpeed",
          "font",
          "fps",
          "forwardSpeed",
          "glyphFlip",
          "glyphRotation",
          "numColumns",
          "palette",
          "paletteHSL",
          "raindropLength",
          "renderer",
          "resolution",
          "skipIntro",
          "slant",
          "suppressWarnings",
          "version",
          "volumetric",
        ]);
        const safeEffects = new Set([
          "none",
          "plain",
          "palette",
          "mirror",
          "pride",
          "stripes",
          "trans",
          "transPride",
        ]);
        const params = new URLSearchParams(window.location.search);
        const next = new URLSearchParams();

        for (const [key, value] of params.entries()) {
          if (!allowed.has(key)) continue;
          if (key === "effect" && !safeEffects.has(value)) continue;
          next.set(key, value);
        }

        next.set("camera", "false");
        next.set("suppressWarnings", next.get("suppressWarnings") || "true");

        const query = next.toString();
        const nextUrl = `${window.location.pathname}${query ? `?${query}` : ""}`;
        if (`${window.location.pathname}${window.location.search}` !== nextUrl) {
          window.history.replaceState({}, "", nextUrl);
        }
      })();
    </script>
  </head>
  <body>
    <!--
      This renderer vendors Rezmason/matrix commit 5ba90490453ceceb6812d6b1bc658a99a92411d0.
      Original project: https://github.com/Rezmason/matrix

    <script type="module" src="js/main.js"></script>
  </body>
</html>
