<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>
    (function () {
      var stored = null;
      try {
        stored = localStorage.getItem("vatio_board_lang");
      } catch (_error) {}
      var lang = stored || (navigator.language && navigator.language.startsWith("es") ? "es" : "en");
      document.documentElement.lang = lang;
      window.__lang = lang;
    })();
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <link rel="icon" type="image/svg+xml" href="/favicon_dark.svg?v=2" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon_ligth.svg?v=2" media="(prefers-color-scheme: light)" />
  <link id="favicon-fallback" rel="icon" type="image/svg+xml" href="/favicon_ligth.svg?v=2" />
  <link id="shortcut-favicon" rel="shortcut icon" href="/favicon_ligth.svg?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <script>
    (function () {
      var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      var icons = [
        document.getElementById("favicon-fallback"),
        document.getElementById("shortcut-favicon"),
      ];

      function applyThemeFavicon() {
        var href = (query && query.matches ? "/favicon_dark.svg" : "/favicon_ligth.svg") + "?v=2";
        icons.forEach(function (icon) {
          if (icon) icon.href = href;
        });
      }

      applyThemeFavicon();
      if (!query) return;
      if (query.addEventListener) query.addEventListener("change", applyThemeFavicon);
      else if (query.addListener) query.addListener(applyThemeFavicon);
    })();
  </script>

  <title>VatioBoard</title>
  <meta
    name="description"
    content="VatioBoard is a local-first driving companion with GPS speed, drive replay, acceleration timing, cloud library, and persistent audio playback."
  />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <link rel="canonical" href="https://vatioboard.com/" />

  <meta property="og:site_name" content="VatioLibre" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="VatioBoard" />
  <meta property="og:description" content="GPS speed, drive replay, acceleration timing, cloud library, and persistent audio playback in one local-first app." />
  <meta property="og:url" content="https://vatioboard.com/" />
  <meta property="og:image" content="https://vatioboard.com/img/vatio-board-speed-og-1200x630.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="VatioBoard" />
  <meta name="twitter:description" content="GPS speed, drive replay, acceleration timing, cloud library, and persistent audio playback in one local-first app." />
  <meta name="twitter:image" content="https://vatioboard.com/img/vatio-board-speed-og-1200x630.jpg" />

  <style>
    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <h1 class="sr-only">VatioBoard</h1>
  <div id="app">
    <main id="app-view" aria-live="polite"></main>
    <div id="app-persistent-layer"></div>
  </div>
  <script type="module" src="/src/app/main.js"></script>
</body>
</html>
