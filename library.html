<!doctype html>
<!-- Legacy standalone test harness. Production ships through index.html SPA routes. -->
<html lang="en" class="library-page">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('vatio_board_lang');
        } catch (_error) {}
        var lang =
          stored || (navigator.language && navigator.language.startsWith('es') ? 'es' : 'en');
        document.documentElement.lang = lang;
        window.__lang = lang;
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon_dark.svg?v=2"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon_ligth.svg?v=2"
      media="(prefers-color-scheme: light)"
    />
    <link id="favicon-fallback" rel="icon" type="image/svg+xml" href="/favicon_ligth.svg?v=2" />
    <link id="shortcut-favicon" rel="shortcut icon" href="/favicon_ligth.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script>
      (function () {
        var query = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        var icons = [
          document.getElementById('favicon-fallback'),
          document.getElementById('shortcut-favicon'),
        ];

        function applyThemeFavicon() {
          var href = (query && query.matches ? '/favicon_dark.svg' : '/favicon_ligth.svg') + '?v=2';
          icons.forEach(function (icon) {
            if (icon) icon.href = href;
          });
        }

        applyThemeFavicon();
        if (!query) return;
        if (query.addEventListener) query.addEventListener('change', applyThemeFavicon);
        else if (query.addListener) query.addListener(applyThemeFavicon);
      })();
    </script>

    <title>VatioBoard Cloud Library - Recover your saved speed, accel, board, and media data</title>
    <meta
      name="description"
      content="Browse your VatioBoard cloud library across devices with summary-first speed replays, accel runs, editable board documents, and private media assets."
    />
    <meta
      name="robots"
      content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://vatioboard.com/library.html" />

    <style>
      .sr-only {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body class="library-page">
    <h1 class="sr-only" data-i18n="cloudLibrary">Cloud library</h1>
    <div class="library-app">
      <header class="library-header">
        <div class="header-inner library-header-inner">
          <div class="brand" data-i18n-title="tagline" title="Simple full-page drawing board by Vatio Libre">
            <a class="brand-home" href="/" data-i18n-aria="openBoard" aria-label="Open Vatio Board">
              <span class="dot" aria-hidden="true"></span>
              <picture class="brand-logo" aria-hidden="true">
                <source srcset="/img/vb_logo_dark.svg" media="(prefers-color-scheme: dark)" />
                <source srcset="/img/vb_logo_light.svg" media="(prefers-color-scheme: light)" />
                <img src="/img/vb_logo_light.svg" alt="" width="757" height="107" decoding="async" />
              </picture>
              <span class="sr-only" data-i18n="brand">Vatio Board</span>
            </a>
            <button
              id="langToggle"
              type="button"
              class="lang-toggle"
              data-i18n-aria="changeLanguage"
              aria-label="Change language"
            >
              EN
            </button>
          </div>

          <div class="toolbar library-toolbar" role="toolbar" data-i18n-aria="cloudLibraryTools" aria-label="Cloud library tools">
            <div class="library-toolbar-right">
              <div class="library-toolbar-strip">
                <div class="tools-menu library-tools-menu">
                  <button
                    id="libraryToolsMenuBtn"
                    type="button"
                    class="tools-menu-btn library-toolbar-icon-btn"
                    data-i18n-aria="pages"
                    data-i18n-title="pages"
                    aria-label="Pages"
                    title="Pages"
                    aria-haspopup="true"
                    aria-expanded="false"
                  >
                    <span class="btn-icon" aria-hidden="true"></span>
                  </button>
                  <div id="libraryToolsMenuList" class="tools-menu-list" hidden>
                    <div class="compact-tools-menu-brand" data-i18n-title="tagline" title="Simple full-page drawing board by Vatio Libre">
                      <span class="dot" aria-hidden="true"></span>
                      <picture class="brand-logo compact-tools-menu-logo" aria-hidden="true">
                        <source srcset="/img/vb_logo_dark.svg" media="(prefers-color-scheme: dark)" />
                        <source srcset="/img/vb_logo_light.svg" media="(prefers-color-scheme: light)" />
                        <img src="/img/vb_logo_light.svg" alt="" width="757" height="107" decoding="async" />
                      </picture>
                      <span class="sr-only" data-i18n="brand">Vatio Board</span>
                      <button
                        id="libraryLangToggleMenu"
                        type="button"
                        class="lang-toggle"
                        data-i18n-aria="changeLanguage"
                        aria-label="Change language"
                        data-lang-toggle
                      >
                        EN
                      </button>
                    </div>
                    <button id="openLibraryBoardMenu" type="button" class="btn-with-icon">
                      <span class="btn-icon" aria-hidden="true"></span>
                      <span data-i18n="openBoard">Open board</span>
                    </button>
                    <button id="openLibrarySpeedMenu" type="button" class="btn-with-icon">
                      <span class="btn-icon" aria-hidden="true"></span>
                      <span data-i18n="speedometer">Speedometer</span>
                    </button>
                    <button id="openLibraryReplayMenu" type="button" class="btn-with-icon">
                      <span class="btn-icon" aria-hidden="true"></span>
                      <span data-i18n="driveReplay">Drive Replay</span>
                    </button>
                    <button id="openLibraryAccelMenu" type="button" class="btn-with-icon">
                      <span class="btn-icon" aria-hidden="true"></span>
                      <span data-i18n="accelerationTest">Acceleration Test</span>
                    </button>
                    <button
                      id="openLibraryCurrentMenu"
                      type="button"
                      class="btn-with-icon"
                      data-current-page="true"
                      aria-current="page"
                      disabled
                    >
                      <span class="btn-icon" aria-hidden="true"></span>
                      <span data-i18n="cloudLibrary">Cloud library</span>
                    </button>
                    <form class="backend-auth" data-backend-auth novalidate>
                      <p class="backend-auth-title" data-i18n="authTitle">VatioLibre account</p>
                      <p
                        class="backend-auth-status"
                        data-backend-auth-status
                        role="status"
                        aria-live="polite"
                        data-i18n="authCheckingSession"
                      >
                        Checking session...
                      </p>
                      <input
                        class="backend-auth-input"
                        data-backend-auth-user
                        data-backend-auth-guest
                        type="text"
                        autocomplete="username"
                        spellcheck="false"
                        aria-label="Email / username"
                        data-i18n-aria="authUsername"
                        placeholder="Email / username"
                        data-i18n-placeholder="authUsername"
                      />
                      <input
                        class="backend-auth-input"
                        data-backend-auth-password
                        data-backend-auth-guest
                        type="password"
                        autocomplete="current-password"
                        aria-label="Password"
                        data-i18n-aria="authPassword"
                        placeholder="Password"
                        data-i18n-placeholder="authPassword"
                      />
                      <button type="submit" data-backend-auth-login data-backend-auth-guest data-i18n="authLogin">
                        Log in
                      </button>
                      <button type="button" data-backend-auth-logout data-backend-auth-authenticated data-i18n="authLogout">
                        Log out
                      </button>
                      <a
                        class="backend-auth-link"
                        data-backend-auth-guest
                        data-backend-auth-signup
                        href="https://www.vatiolibre.com/login#signup"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-i18n="authCreateAccount"
                      >
                        Create account
                      </a>
                      <a
                        class="backend-auth-link"
                        data-backend-auth-guest
                        data-backend-auth-forgot
                        href="https://www.vatiolibre.com/login#forgot"
                        target="_blank"
                        rel="noopener noreferrer"
                        data-i18n="authForgotPassword"
                      >
                        Forgot password
                      </a>
                    </form>
                  </div>
                </div>

                <div id="libraryToolbarVolume" class="library-toolbar-volume" hidden>
                  <button
                    id="libraryToolbarMute"
                    type="button"
                    class="library-toolbar-icon-btn"
                    data-i18n-aria="mediaPlayerMute"
                    data-i18n-title="mediaPlayerMute"
                    aria-label="Mute"
                    title="Mute"
                  >
                    <span class="btn-icon" aria-hidden="true"></span>
                  </button>
                  <input
                    id="libraryToolbarVolumeSlider"
                    type="range"
                    class="library-toolbar-volume-slider"
                    min="0"
                    max="100"
                    value="100"
                    step="1"
                    data-i18n-aria="mediaPlayerVolume"
                    aria-label="Volume"
                  />
                </div>

                <button
                  id="libraryRefresh"
                  type="button"
                  class="library-toolbar-icon-btn"
                  data-i18n-aria="cloudLibraryRefresh"
                  data-i18n-title="cloudLibraryRefresh"
                  aria-label="Refresh"
                  title="Refresh"
                >
                  <span class="btn-icon" aria-hidden="true"></span>
                </button>
              </div>
            </div>
          </div>

          <span class="route-chip library-page-chip" aria-hidden="true" data-i18n="cloudLibraryRoute">LIBRARY</span>
        </div>
      </header>

      <main class="library-main">
        <section class="library-controls">
          <div class="library-tabs" role="tablist" aria-label="Cloud library sections">
            <button type="button" class="library-tab" data-tab="speed" role="tab" aria-selected="false">
              <span class="btn-icon" aria-hidden="true"></span>
              <span data-i18n="cloudLibrarySpeed">Speed</span>
            </button>
            <button type="button" class="library-tab" data-tab="accel" role="tab" aria-selected="false">
              <span class="btn-icon" aria-hidden="true"></span>
              <span data-i18n="cloudLibraryAccel">Accel</span>
            </button>
            <button type="button" class="library-tab" data-tab="board_documents" role="tab" aria-selected="false">
              <span class="btn-icon" aria-hidden="true"></span>
              <span data-i18n="cloudLibraryBoardDocuments">Board Documents</span>
            </button>
            <button type="button" class="library-tab" data-tab="media" role="tab" aria-selected="false">
              <span class="btn-icon" aria-hidden="true"></span>
              <span data-i18n="cloudLibraryMedia">Media</span>
            </button>
          </div>

          <form id="librarySearchForm" class="library-search-form">
            <input
              id="librarySearch"
              type="search"
              spellcheck="false"
              autocomplete="off"
              data-i18n-aria="cloudLibrarySearch"
              data-i18n-placeholder="cloudLibrarySearch"
              aria-label="Search"
              placeholder="Search"
            />
            <select id="librarySort" data-i18n-aria="cloudLibrarySort" aria-label="Sort">
              <option value="newest" data-i18n="cloudLibrarySortNewest">Newest first</option>
              <option value="oldest" data-i18n="cloudLibrarySortOldest">Oldest first</option>
              <option value="title_asc" data-i18n="cloudLibrarySortTitleAsc">Title A-Z</option>
              <option value="title_desc" data-i18n="cloudLibrarySortTitleDesc">Title Z-A</option>
            </select>
          </form>
        </section>

        <p id="libraryStatus" class="library-status" hidden aria-live="polite"></p>

        <section class="library-shell">
          <section class="library-list-panel" aria-live="polite">
            <div id="libraryListEmpty" class="library-list-empty" data-i18n="cloudLibraryLoading">
              Loading cloud library...
            </div>
            <div id="libraryList" class="library-list"></div>
            <button id="libraryLoadMore" type="button" class="library-load-more" data-i18n="cloudLibraryLoadMore" hidden>
              Load more
            </button>
          </section>

          <section class="library-detail-panel">
            <div id="libraryDetailEmpty" class="library-detail-empty" data-i18n="cloudLibrarySelectPrompt">
              Select a cloud record to inspect it here.
            </div>

            <article id="libraryDetailCard" class="library-detail-card" hidden>
              <div id="libraryDetailPreview" class="library-detail-preview"></div>
              <div class="library-detail-header">
                <div class="library-detail-copy">
                  <h2 id="libraryDetailTitle" class="library-detail-title"></h2>
                  <p id="libraryDetailSubtitle" class="library-detail-subtitle"></p>
                </div>
                <div class="library-detail-actions">
                  <button id="libraryActionOpen" type="button" class="library-action-primary">
                    <span class="btn-icon" aria-hidden="true"></span>
                    <span data-i18n="cloudLibraryOpen">Open</span>
                  </button>

                  <div class="tools-menu library-overflow-menu">
                    <button
                      id="libraryOverflowBtn"
                      type="button"
                      class="library-overflow-btn"
                      data-i18n-aria="cloudLibraryMoreActions"
                      data-i18n-title="cloudLibraryMoreActions"
                      aria-label="More actions"
                      title="More actions"
                      aria-haspopup="true"
                      aria-expanded="false"
                    >
                      <span class="btn-icon" aria-hidden="true"></span>
                    </button>
                    <div id="libraryOverflowList" class="tools-menu-list library-overflow-list" hidden>
                      <button id="libraryActionDownload" type="button" class="btn-with-icon" hidden>
                        <span class="btn-icon" aria-hidden="true"></span>
                        <span data-i18n="cloudLibraryDownload">Download</span>
                      </button>
                      <button id="libraryActionPin" type="button" class="btn-with-icon" hidden>
                        <span class="btn-icon" aria-hidden="true"></span>
                        <span data-i18n="cloudLibraryPin">Pin offline</span>
                      </button>
                      <button id="libraryActionRename" type="button" class="btn-with-icon" hidden>
                        <span class="btn-icon" aria-hidden="true"></span>
                        <span data-i18n="cloudLibraryRename">Rename</span>
                      </button>
                      <button id="libraryActionDelete" type="button" class="btn-with-icon btn-danger" hidden>
                        <span class="btn-icon" aria-hidden="true"></span>
                        <span data-i18n="cloudLibraryDelete">Delete</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <dl id="libraryDetailMeta" class="library-detail-meta"></dl>
            </article>
          </section>
        </section>
      </main>
    </div>

    <script type="module" src="/src/library/library.js"></script>
  </body>
</html>
